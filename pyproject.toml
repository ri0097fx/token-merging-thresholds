[project]
name = "token-merging-thresholds"
version = "0.1.0"
description = "Learning per-block token merging thresholds for vision transformers under a latency budget"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0", "numpy>=1.24"]

[project.scripts]
tmt-train = "tmt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tmt"]
